# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Chalmers-app-sommaren-2026
      # kar-ui-kit is consumed via a `file:../kar-ui-kit` dependency, which
      # only resolves because it's a sibling folder on a local dev machine.
      # Check it out as a true sibling here too, so npm ci/tsc/eslint/jest
      # can actually find it - without this, "Cannot find module 'kar-ui-kit'"
      # is the only possible outcome, since nothing else provides that path.
      - uses: actions/checkout@v4
        with:
          repository: Vandahlen/kar-ui-kit
          path: kar-ui-kit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # kar-ui-kit's own source imports react/react-native/react-native-svg
      # directly (this repo's npm ci only installs its own node_modules and
      # symlinks kar-ui-kit in - it never installs kar-ui-kit's OWN
      # dependencies). Without this, tsc can't resolve those imports when it
      # follows the symlink into kar-ui-kit's real source files.
      - working-directory: kar-ui-kit
        run: npm ci
      - working-directory: Chalmers-app-sommaren-2026
        run: npm ci
      - name: Typecheck (mobile app only, excludes chalmers-admin/)
        working-directory: Chalmers-app-sommaren-2026
        run: npx tsc --noEmit | grep -v "^chalmers-admin/" | (! grep .)
      - working-directory: Chalmers-app-sommaren-2026
        run: npx eslint .
      # App.tsx constructs SupabaseListingsRepository at module scope, which
      # throws a readable error (by design - see DatabaseAdapter.ts) if
      # API_URL/API_KEY are missing. .env is gitignored (contains secrets),
      # so a fresh checkout has none - use the tracked placeholder values
      # instead, since App.test.tsx never makes a real network call.
      - name: Provide placeholder .env for tests
        working-directory: Chalmers-app-sommaren-2026
        run: cp .env.example .env
      - working-directory: Chalmers-app-sommaren-2026
        run: npm test
      - name: Install and build chalmers-admin
        working-directory: Chalmers-app-sommaren-2026/chalmers-admin
        run: npm install && npm run build

  ios:
    # macos-14's default Xcode is 15.4; RN 0.86 requires >=16.1. macos-15
    # defaults to a current Xcode that satisfies this.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: Chalmers-app-sommaren-2026
      - uses: actions/checkout@v4
        with:
          repository: Vandahlen/kar-ui-kit
          path: kar-ui-kit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: kar-ui-kit
        run: npm ci
      - working-directory: Chalmers-app-sommaren-2026
        run: npm ci
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: Chalmers-app-sommaren-2026
      - name: Install CocoaPods dependencies
        working-directory: Chalmers-app-sommaren-2026/ios
        run: bundle exec pod install
      - name: Build for iOS Simulator
        working-directory: Chalmers-app-sommaren-2026/ios
        run: |
          xcodebuild \
            -workspace MyNewProject.xcworkspace \
            -scheme MyNewProject \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            build \
            CODE_SIGNING_ALLOWED=NO
